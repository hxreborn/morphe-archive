# Bundle version. Read by the build during release packaging.
version=0.1.4

# Registry coordinates for the patch bundle.
group=app.keropatches

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

# Registry credentials must never live here. This file is tracked, because it
# carries the bundle version. Put gpr.user and gpr.key in
# %USERPROFILE%\.gradle\gradle.properties instead, outside the repository.
