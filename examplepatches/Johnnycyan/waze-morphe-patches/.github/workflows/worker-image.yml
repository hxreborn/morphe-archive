name: Worker image

on:
  push:
    branches: [main]
    paths:
      - worker/**
      - .github/workflows/worker-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-worker" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: worker
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
